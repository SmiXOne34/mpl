version: '3'

services:
  app:
    build: .
    ports:
      - "9091:9091"
    environment:
      - NODE_ENV=production
      - PORT=9091
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - JWT_COOKIE_EXPIRE=${JWT_COOKIE_EXPIRE}
      - FRONTEND_URL=${FRONTEND_URL}
      - CLIENT_URL=${FRONTEND_URL}
      - REACT_APP_API_URL=/api
      - COOKIE_SECURE=false
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - app_logs:/app/logs
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app_logs: