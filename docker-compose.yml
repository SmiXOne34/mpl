version: '3'

services:
  app:
    build: .
    ports:
      - "9091:9091"
    environment:
      - NODE_ENV=production
      - PORT=9091
      - MONGO_URI=mongodb://mongo:27017/mealwise
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE}
      - JWT_COOKIE_EXPIRE=${JWT_COOKIE_EXPIRE}
      - FRONTEND_URL=${FRONTEND_URL}
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mealwise-network

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mealwise-network
    restart: always
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  mealwise-network:
    driver: bridge

volumes:
  mongo-data: