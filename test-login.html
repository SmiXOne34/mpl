<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      min-height: 100px;
    }
  </style>
</head>
<body>
  <h1>Test Login</h1>
  
  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" id="email" value="test123@example.com">
  </div>
  
  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" value="password123">
  </div>
  
  <button onclick="login()">Login</button>
  
  <div id="result">
    <p>Results will appear here...</p>
  </div>
  
  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Sending request...</p>';
      
      try {
        const response = await fetch('http://localhost:9090/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email,
            password,
          }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <h3>Response:</h3>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
        
        if (data.success) {
          resultDiv.innerHTML += `
            <p style="color: green;">Login successful!</p>
            <p>Token: ${data.token}</p>
          `;
          
          // Store token in localStorage
          localStorage.setItem('token', data.token);
          
          // Test the /api/auth/me endpoint
          testMe(data.token);
        } else {
          resultDiv.innerHTML += `
            <p style="color: red;">Login failed: ${data.error || 'Unknown error'}</p>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <h3>Error:</h3>
          <pre>${error.message}</pre>
        `;
      }
    }
    
    async function testMe(token) {
      const resultDiv = document.getElementById('result');
      
      try {
        const response = await fetch('http://localhost:9090/api/auth/me', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          credentials: 'include'
        });
        
        const data = await response.json();
        
        resultDiv.innerHTML += `
          <h3>User Data:</h3>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultDiv.innerHTML += `
          <h3>Error fetching user data:</h3>
          <pre>${error.message}</pre>
        `;
      }
    }
  </script>
</body>
</html>
